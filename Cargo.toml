[package]
name = "wattdeck"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Terminal dashboard for monitoring EcoFlow power stations"
repository = "https://github.com/olexanderboychuk/wattdeck"
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.28", features = ["event-stream"] }
directories = "5"
hex = "0.4"
hmac = "0.13"
futures-util = "0.3"
keyring = "4"
rpassword = "7.5"
ratatui = "0.28"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "http2", "query"] }
rumqttc = "0.25"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
toml = "1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
insta = "1"
tempfile = "3.27.0"

[[bin]]
name = "wattdeck"
path = "src/main.rs"
